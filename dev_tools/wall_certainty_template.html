  return c<50?lerp(c0,c50,c/50):lerp(c50,c100,(c-50)/50);
}
// certainty per cell: cov>=0 ? 100-cov : null
const cert = new Array(D.w*D.h).fill(null);
if (D.cov) for (let i=0;i<D.cov.length;i++) if (D.cov[i]>=0) cert[i]=100-D.cov[i];

function renderBase(){
  mapC.width=D.w; mapC.height=D.h;
  const ctx=mapC.getContext('2d'), img=ctx.createImageData(D.w,D.h);
  const free=hex2rgb(tok('--free')), wall=hex2rgb(tok('--wall')), unk=hex2rgb(tok('--unknown'));
  document.getElementById('swFree').style.background=tok('--free');
  document.getElementById('swWall').style.background=tok('--wall');
  document.getElementById('swUnk').style.background=tok('--unknown');
  for(let r=0;r<D.h;r++)for(let c=0;c<D.w;c++){
    const i=r*D.w+c, o=((D.h-1-r)*D.w+c)*4;   // row 0 at bottom
    let rgb = D.grid[i]===-1?unk:(D.grid[i]>50?wall:free);
    if(cert[i]!==null) rgb=certColor(cert[i]);
    img.data[o]=rgb[0];img.data[o+1]=rgb[1];img.data[o+2]=rgb[2];img.data[o+3]=255;
  }
  ctx.putImageData(img,0,0);
}
function layout(){
  const w=stage.clientWidth,h=stage.clientHeight;
  for(const cv of [mapC,ovC]){cv.style.left=tx+'px';cv.style.top=ty+'px';}
  mapC.style.width=(D.w*scale)+'px'; mapC.style.height=(D.h*scale)+'px';
  ovC.width=D.w*scale; ovC.height=D.h*scale;
  ovC.style.width=(D.w*scale)+'px'; ovC.style.height=(D.h*scale)+'px';
  drawOverlay();
}
function drawOverlay(){
  const ctx=ovC.getContext('2d'); ctx.clearRect(0,0,ovC.width,ovC.height);
  if(D.robot){ // robot marker: triangle at map-frame pose, nose = heading
    const rx=((D.robot.x-D.ox)/D.res)*scale,
          ry=(D.h-((D.robot.y-D.oy)/D.res))*scale,
          a=-D.robot.yaw,               // canvas y is flipped
          s=Math.max(6,scale*2.2);
    ctx.save(); ctx.translate(rx,ry); ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(s,0); ctx.lineTo(-s*0.55,s*0.45); ctx.lineTo(-s*0.55,-s*0.45);
    ctx.closePath();
    ctx.fillStyle='#2f81f7'; ctx.strokeStyle='#fff';
    ctx.lineWidth=Math.max(1,s*0.12);
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
  if(!showNums||scale<20) return;
  ctx.font=`600 ${Math.max(8,scale*0.32)}px ui-monospace,monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let r=0;r<D.h;r++)for(let c=0;c<D.w;c++){
    const i=r*D.w+c; if(cert[i]===null) continue;
    const x=(c+0.5)*scale, y=(D.h-1-r+0.5)*scale;
    ctx.fillStyle='rgba(0,0,0,0.75)';
    ctx.fillText(cert[i], x, y);
  }
}
function fit(){
  scale=Math.max(1,Math.floor(Math.min(stage.clientWidth/D.w,stage.clientHeight/D.h)));
  tx=(stage.clientWidth-D.w*scale)/2; ty=(stage.clientHeight-D.h*scale)/2; layout();
}
stage.addEventListener('wheel',e=>{e.preventDefault();
  const f=e.deltaY<0?1.25:0.8, ns=Math.min(60,Math.max(1,scale*f));
  const mx=e.clientX-stage.getBoundingClientRect().left, my=e.clientY-stage.getBoundingClientRect().top;
  tx=mx-(mx-tx)*ns/scale; ty=my-(my-ty)*ns/scale; scale=ns; layout();},{passive:false});
let drag=null;
stage.addEventListener('pointerdown',e=>{drag=[e.clientX-tx,e.clientY-ty];stage.classList.add('drag')});
window.addEventListener('pointerup',()=>{drag=null;stage.classList.remove('drag')});
stage.addEventListener('pointermove',e=>{
  if(drag){tx=e.clientX-drag[0];ty=e.clientY-drag[1];layout();return;}
  const rect=stage.getBoundingClientRect();
  const c=Math.floor((e.clientX-rect.left-tx)/scale);
  const rTop=Math.floor((e.clientY-rect.top-ty)/scale);
  const r=D.h-1-rTop;
  if(c<0||c>=D.w||r<0||r>=D.h){hud.style.display='none';return;}
  const i=r*D.w+c, wx=(D.ox+(c+0.5)*D.res).toFixed(2), wy=(D.oy+(r+0.5)*D.res).toFixed(2);
  const kind=D.grid[i]===-1?'unexplored':(D.grid[i]>50?'wall':'free');
  let inner=`<div>(${wx}, ${wy}) m · ${kind}</div>`;
  if(cert[i]!==null) inner+=`<div class="big">${cert[i]}%</div><div style="color:var(--ink-2)">inspection certainty</div>`;
  else if(kind==='wall') inner+=`<div style="color:var(--ink-2)">no face observation yet</div>`;
  hud.innerHTML=inner;
  hud.style.display='block';
  hud.style.left=Math.min(stage.clientWidth-190,e.clientX-rect.left+16)+'px';
  hud.style.top=(e.clientY-rect.top+16)+'px';
});
stage.addEventListener('pointerleave',()=>hud.style.display='none');
document.getElementById('numsBtn').addEventListener('click',e=>{
  showNums=!showNums;e.target.setAttribute('aria-pressed',showNums);drawOverlay();});
document.getElementById('fitBtn').addEventListener('click',fit);
new MutationObserver(()=>{renderBase();drawOverlay();})
  .observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{renderBase();drawOverlay();});
window.addEventListener('resize',layout);
renderBase(); fit();
</script>
