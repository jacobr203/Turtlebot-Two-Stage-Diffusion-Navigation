# Single-stage variant v2: conditioned on the FINAL GOAL only (no subgoal
# planner). Trained on dataset v2 (centered wide-preferring expert routes,
# 312-world train pool incl. winding/scatter), decisions.md #27.
run_name: single_stage_v2
data_dir: /home/turtlebot/pathfinding_algorithms/capstone/expert/data/v2
conditioning: goal

horizon: 8            # predicted waypoints (0.25 s spacing -> 2 s reach)
obs_stack: 2
goal_clip: 3.0        # [m] distance feature saturation
T: 35                 # DDPM denoising steps (proposal value)

channels: [64, 128, 256]
batch_size: 256
lr: 1.0e-4
weight_decay: 1.0e-6
ema_decay: 0.999
epochs: 60
eval_every: 5
val_episode: 3        # episode 3 of every world held out for offline metrics

seed: 7
device: cpu
threads: 12
num_workers: 4
