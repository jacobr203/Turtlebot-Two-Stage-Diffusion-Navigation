# Two-stage policy on the combined pool plus corridor-pocket worlds, which teach threading
# 0.30 m pocket mouths. expert/data/v5 is a symlinked union of data/v3 and data/pocket_v1.
# 160-deg forward scan arc (replicate padding, no wrap), 1.5 m motion-class-balanced
# segments, 7.5% scan corruption.
run_name: two_stage_v5
data_dir: expert/data/v5
conditioning: subgoal_goal

horizon: 8
obs_stack: 2
goal_clip: 3.0
T: 35

scan_arc_deg: 160
corrupt_frac: 0.075
segment_balance: true
seg_len_m: 1.5

channels: [64, 128, 256]
batch_size: 256
lr: 1.0e-4
weight_decay: 1.0e-6
ema_decay: 0.999
epochs: 60
eval_every: 5
val_episode: 3

seed: 7
device: cpu
threads: 12
num_workers: 4
