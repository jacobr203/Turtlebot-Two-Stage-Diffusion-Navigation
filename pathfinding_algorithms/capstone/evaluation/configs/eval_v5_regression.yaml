# Run with TWO_STAGE_CKPT=diffusion/runs/two_stage_v5/best.pt; compare
# against two_stage_v4's full-matrix numbers on these same worlds — the
# pocket pool must not erode the BARN closed-loop headline (63% @ 4 Hz).
# 1 model x 10 worlds x 6 trials = 60 trials (~35 min on 3 shards).
