# Single-stage half of the v5 ablation. Same worlds, rates and trial count
# as eval_full_v5_two_stage.yaml, so the two v5 rows pair directly and the
# difference between them isolates the A* planning stage.
#
# Checkpoint via env override (trial.py CKPTS):
#   SINGLE_STAGE_CKPT=diffusion/runs/single_stage_v5/best.pt
#
# 1 model x 40 holdout worlds x 3 rates x 4 trials = 480 trials.
# Cap at 3 workers x 4 threads on 16 cores: over-sharding inflates the
# measured sampling latency and degrades the closed-loop result with it.
run_id: full_v5_single_stage
models: [single_stage]
worlds: holdout
hz_list: [2.0, 3.0, 4.0]
trials: 4
denoiser: ddpm
timeout_sim_s: 240.0
threads: 4
