# Expert-data collection v2: 260 BARN train worlds plus the dense_worlds.yaml train splits,
# with centered, wide-preferring routes (common.grid.plan_route).
# inflate_radius is the fallback gate; plan_route tries WIDE_INFLATE_RADIUS (0.24) first.

dataset_id: v2
seed: 7

# Episodes 0-3 are clean (3 = offline validation split). Episodes 4-5 are noise-injected
# (DART-style): the centered expert otherwise never passes within ~0.3 m of obstacles,
# leaving the policy no near-obstacle supervision.
episodes_per_world: 6
perturb_from_episode: 4
perturb_every: 2.5          # mean seconds between veer bursts
perturb_dur: 0.45           # burst length [s]
perturb_w: 1.2              # max |yaw bias| [rad/s]
perturb_min_clear: 0.35     # no bursts with obstacles this close ahead [m]

inflate_radius: 0.21        # fallback A* clearance from cylinder centers [m]
start_jitter_xy: 0.15       # uniform +- [m] around (-2.25, 3.0)
start_jitter_yaw: 0.15      # uniform +- [rad] around 1.5708
goal_jitter_xy: 0.30        # uniform +- [m] around (-2.25, 13.0)
subgoal_dist: 1.2           # two-stage conditioning label lookahead [m]
rate_hz: 4.0                # recorder sampling rate (sim time)
tracker_rate_hz: 20.0       # pure-pursuit control rate (sim time)
timeout_sim_s: 240.0
